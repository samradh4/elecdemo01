name: Build V4.4 Fast Batch APK

on:
  push:
    branches:
      - v4-3-client-features
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir httpx
      - name: Compile backend
        working-directory: backend
        run: python -m py_compile main.py v4.py v41.py pdf_bulk_v42.py pdf_batch_v440.py pdf_import_v42.py fast_ocr_v422.py fast_text_pdf_v430.py v421_demo_fix.py v423_import_diagnostics.py v430_features.py main_v4_entry.py
      - name: V4.1 field operations smoke test
        working-directory: backend
        run: python test_v41_smoke.py
      - name: V4.2 bulk PDF/admin portal smoke test
        working-directory: backend
        run: python test_v42_smoke.py
      - name: V4.3 approval and PDF fast-path smoke test
        working-directory: backend
        run: python test_v43_smoke.py
      - name: V4.4 fast multi-PDF batch smoke test
        working-directory: backend
        run: python test_v44_smoke.py
      - name: Verify Docker image with OCR dependencies
        run: docker build -t constituency-manager-v44 ./backend

  build-apk:
    needs: test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare V4.4 mobile app
        run: |
          cp AppV41.tsx App.tsx
          node scripts/write-safe-icon.js assets/icon.png
          node scripts/patch-v411-sqlite.js App.tsx
          node scripts/patch-v430-client.js App.tsx
          node scripts/patch-v440-batch.js App.tsx
          grep -q "dbPromise" App.tsx
          grep -q "romanizeHindi" App.tsx
          grep -q "Roman name" App.tsx
          grep -q "Select multiple PDFs" App.tsx
          grep -q "/admin/pdf/bulk/single" App.tsx
          ! grep -q "aSyncInit();" App.tsx
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Expo native modules
        run: npx expo install expo-sqlite expo-secure-store @react-native-community/netinfo expo-location expo-task-manager expo-document-picker expo-file-system expo-sharing
      - name: Type check
        run: npx tsc --noEmit
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify and collect APK
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" Constituency-Manager-4.4.0-Fast-Batch.apk
          unzip -t Constituency-Manager-4.4.0-Fast-Batch.apk >/dev/null
          sha256sum Constituency-Manager-4.4.0-Fast-Batch.apk > Constituency-Manager-4.4.0-Fast-Batch.sha256
          ls -lh Constituency-Manager-4.4.0-Fast-Batch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Constituency-Manager-4.4.0-Fast-Batch-APK
          path: |
            Constituency-Manager-4.4.0-Fast-Batch.apk
            Constituency-Manager-4.4.0-Fast-Batch.sha256
          retention-days: 30
