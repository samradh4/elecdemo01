name: Build V4 Offline Booth APK

on:
  push:
    branches:
      - v4-offline-booth-workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir httpx
      - name: Compile backend
        working-directory: backend
        run: python -m py_compile main.py v4.py main_v4_entry.py
      - name: V4 auth assignment sync smoke test
        working-directory: backend
        run: python test_v4_smoke.py
      - name: Verify Docker image
        run: docker build -t constituency-manager-v4 ./backend

  build-apk:
    needs: test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use V4 mobile app and apply sync safety fixes
        run: |
          cp AppV4.tsx App.tsx
          python scripts/patch_v4_mobile.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Expo-compatible native packages
        run: npx expo install expo-sqlite expo-secure-store @react-native-community/netinfo
      - name: Type check
        run: npx tsc --noEmit
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify and collect APK
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" Constituency-Manager-4.0.0-Offline-Booth.apk
          unzip -t Constituency-Manager-4.0.0-Offline-Booth.apk >/dev/null
          sha256sum Constituency-Manager-4.0.0-Offline-Booth.apk > Constituency-Manager-4.0.0-Offline-Booth.sha256
          ls -lh Constituency-Manager-4.0.0-Offline-Booth.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Constituency-Manager-4.0.0-Offline-Booth-APK
          path: |
            Constituency-Manager-4.0.0-Offline-Booth.apk
            Constituency-Manager-4.0.0-Offline-Booth.sha256
          retention-days: 30
