name: Build Client Ready APK

on:
  push:
    branches:
      - client-ready-apk-3-6-2
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app for managed backend and reliable Android uploads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('App.tsx')
          s = p.read_text()

          s = s.replace(
              "function defaultApiUrl() { return isWeb() ? 'http://127.0.0.1:8000' : ''; }",
              "function defaultApiUrl() { return 'https://elecdemo01.onrender.com'; }"
          )

          s = s.replace(
              "if(raw){ try{ const s=JSON.parse(raw); if(s.apiUrl!==undefined)setApiUrl(s.apiUrl); if(s.apiKey)setApiKey(s.apiKey); if(s.org)setOrg(s.org); }catch{} }",
              "if(raw){ try{ const s=JSON.parse(raw); setApiUrl(defaultApiUrl()); if(s.apiKey)setApiKey(s.apiKey); if(s.org)setOrg(s.org); }catch{} } else { setApiUrl(defaultApiUrl()); }"
          )

          s = s.replace("const timeout=setTimeout(()=>controller.abort(), options.timeoutMs||15000);", "const timeout=setTimeout(()=>controller.abort(), options.timeoutMs||65000);")
          s = s.replace("await request('/health',{timeoutMs:5000});", "await request('/health',{timeoutMs:65000});")
          s = s.replace("await request('/health',{timeoutMs:2500});", "await request('/health',{timeoutMs:65000});")
          s = s.replace("for(let i=0;i<12;i++){", "for(let i=0;i<2;i++){")
          s = s.replace("await new Promise(r=>setTimeout(r,750));", "await new Promise(r=>setTimeout(r,1500));")
          s = s.replace("if(e?.name==='AbortError') throw new Error('Backend timed out. Make sure the API server is running on port 8000.');", "if(e?.name==='AbortError') throw new Error('Server is taking longer than expected. Please check your internet connection and retry.');")
          s = s.replace("if(String(e?.message||e).includes('Failed to fetch')) throw new Error(`Backend is not reachable at ${apiUrl}. Start the backend, then retry.`);", "if(String(e?.message||e).includes('Failed to fetch')) throw new Error('Server is temporarily unreachable. Please check your internet connection and retry.');")

          old_upload = '''  async function uploadFile(path:string,accept:string,mime:string){
    const form=new FormData();
    if(isWeb()){
      const file=await pickWebFile(accept); if(!file)return null; form.append('file',file,file.name);
    }else{
      const r=await DocumentPicker.getDocumentAsync({type:mime,copyToCacheDirectory:true}); if(r.canceled)return null; const a=r.assets[0]; form.append('file',{uri:a.uri,name:a.name,mimeType:a.mimeType||mime} as any);
    }
    const res=await fetch(`${apiUrl.replace(/\\/$/,'')}${path}`,{method:'POST',headers:{...(apiKey?{'X-App-Key':apiKey}:{})},body:form});
    const j=await res.json(); if(!res.ok)throw new Error(j.detail||`HTTP ${res.status}`); return j;
  }'''

          new_upload = '''  async function uploadFile(path:string,accept:string,mime:string){
    if(!apiUrl) throw new Error('Backend URL is not configured');
    const endpoint=`${apiUrl.replace(/\\/$/,'')}${path}`;
    if(isWeb()){
      const file=await pickWebFile(accept); if(!file)return null;
      const form=new FormData(); form.append('file',file,file.name);
      const res=await fetch(endpoint,{method:'POST',headers:{...(apiKey?{'X-App-Key':apiKey}:{})},body:form});
      const j=await res.json(); if(!res.ok)throw new Error(j.detail||`HTTP ${res.status}`); return j;
    }
    const r=await DocumentPicker.getDocumentAsync({type:mime,copyToCacheDirectory:true});
    if(r.canceled)return null;
    const a=r.assets[0];
    try{
      const result=await FileSystem.uploadAsync(endpoint,a.uri,{
        httpMethod:'POST',
        uploadType:FileSystem.FileSystemUploadType.MULTIPART,
        fieldName:'file',
        mimeType:a.mimeType||mime,
        headers:{...(apiKey?{'X-App-Key':apiKey}:{})},
      });
      let j:any={};
      try{j=JSON.parse(result.body||'{}')}catch{throw new Error(`Server returned an invalid response (HTTP ${result.status})`)}
      if(result.status<200||result.status>=300)throw new Error(j.detail||`HTTP ${result.status}`);
      return j;
    }catch(e:any){
      const msg=String(e?.message||e);
      if(/network request failed|network error|failed to fetch/i.test(msg)) throw new Error('PDF upload could not reach the server. Check internet and retry.');
      throw e;
    }
  }'''

          if old_upload not in s:
              raise SystemExit('Could not find original uploadFile function')
          s = s.replace(old_upload, new_upload)

          s = s.replace('<Field label="Backend URL" value={apiUrl} onChangeText={setApiUrl} placeholder="http://127.0.0.1:8000"/>', '<Text style={styles.helpText}>Cloud server is configured automatically.</Text>')
          s = s.replace('<Field label="API key (optional)" value={apiKey} onChangeText={setApiKey} placeholder="Only if APP_API_KEY is enabled"/>', '')
          s = s.replace('<Text style={styles.helpText}>Mac/Windows browser: http://127.0.0.1:8000. Physical phone: use your computer\'s LAN IP, e.g. http://192.168.1.5:8000.</Text>', '<Text style={styles.helpText}>No backend setup is required on this device.</Text>')
          s = s.replace('label="Save settings"', 'label="Save name"')

          for item in [
              "https://elecdemo01.onrender.com",
              "FileSystem.uploadAsync(endpoint",
              "Cloud server is configured automatically.",
              "No backend setup is required on this device."
          ]:
              if item not in s:
                  raise SystemExit(f'Missing expected patch: {item}')

          p.write_text(s)

          ap = Path('app.json')
          d = json.loads(ap.read_text())
          d['expo']['version'] = '3.6.2'
          d['expo'].setdefault('android', {})['package'] = 'com.constituencymanager.app'
          d['expo']['android']['versionCode'] = 362
          ap.write_text(json.dumps(d, indent=2) + '\n')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" Constituency-Manager-3.6.2-Client.apk
          ls -lh Constituency-Manager-3.6.2-Client.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Constituency-Manager-3.6.2-Client-APK
          path: Constituency-Manager-3.6.2-Client.apk
          if-no-files-found: error
          retention-days: 30
